[project]
name = "a-share-quant-lab"
version = "0.1.0"
description = "Extensible personal A-share quantitative research lab"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "akshare>=1.18",
  "duckdb>=1.4",
  "joblib>=1.4",
  "lightgbm>=4.5",
  "mlflow>=3.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=18",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "typer>=0.15",
  "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
quant = "quant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]

[tool.ruff]
line-length = 100
